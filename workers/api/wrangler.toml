# ─────────────────────────────────────────────────────────────────────────────
# pdc-restaurant — restaurant-only PDC (Service + guest booking loop)
# Same Cloudflare account as pdc-phiof; separate Worker / D1 / queues.
# ─────────────────────────────────────────────────────────────────────────────

name = "pdc-restaurant"
main = "src/index.ts"
compatibility_date = "2025-06-01"
account_id = "e83effb8e12473dcd697e82d4e3d9d7b"
workers_dev = true

[vars]
ORGANIZATION_ID = "restaurant"

CORS_ORIGIN = "http://localhost:3000,http://127.0.0.1:3000,https://kitchen.phiof.digital,https://pdc-restaurant-web.justphiof.workers.dev"

AI_EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"

# Demo tools on for pilot seeding / Turnstile bypass in local-style demos
ENABLE_DEMO_TOOLS = "false"

# Tuition / gym scheduling off — Service module owns the floor
ENABLE_SIMPLE_SCHEDULING = "false"
ENABLE_MULTI_LOCATION = "false"

# ── Service module ───────────────────────────────────────────────────────────
ENABLE_SERVICE = "true"
ENABLE_RESERVATIONS = "true"
ENABLE_WAITLIST = "false"
ENABLE_DEPOSITS = "false"
ENABLE_FLOOR_PLAN = "true"
ENABLE_AUTO_ASSIGN = "true"
ENABLE_KITCHEN = "true"

# ── Staff auth ───────────────────────────────────────────────────────────────
AUTH_FROM_EMAIL = "admin@bookings.phiof.digital"
# Guest booking + contact inbox (outbound From/Reply-To and inbound match)
BOOKING_FROM_EMAIL = "admin@bookings.phiof.digital"
AUTH_WEB_ORIGIN = "https://kitchen.phiof.digital"
# Manage links in emails use this (defaults to AUTH_WEB_ORIGIN)
GUEST_BOOKING_ORIGIN = "https://kitchen.phiof.digital"
# SMS off while we pilot email-only confirmations/reminders via Resend
ENABLE_BOOKING_SMS = "true"

# Pin /health deploy_sha to the stamped build-info GIT_SHA (updated by deploy-remote.sh).
EXPECTED_GIT_SHA = "74fdd2f"

# Secrets (set via wrangler secret put — same values as pdc-phiof where shared):
# RESEND_API_KEY, RESEND_WEBHOOK_SECRET (optional), TELNYX_API_KEY, TELNYX_FROM_NUMBER,
# TELNYX_WEBHOOK_PUBLIC_KEY, ENCRYPTION_KEY, TURNSTILE_SECRET_KEY (optional)

[ai]
binding = "AI"

[[vectorize]]
binding = "KNOWLEDGE"
index_name = "pdc-restaurant-knowledge"

[[d1_databases]]
binding = "DB"
database_name = "pdc-restaurant-db"
database_id = "e4147b72-3302-401e-94d2-6a8ac55bbbf5"
migrations_dir = "migrations"

[[queues.producers]]
binding = "AI_QUEUE"
queue = "pdc-restaurant-queue"

[[queues.consumers]]
queue = "pdc-restaurant-queue"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "pdc-restaurant-dlq"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "2c6fcbe41e934f9fa12ed5a4895a0a24"

[triggers]
crons = ["*/5 * * * *"]

# Same-site with kitchen.phiof.digital so Safari/iPad keeps the session cookie
[[routes]]
pattern = "api.kitchen.phiof.digital"
custom_domain = true

[dev]
port = 8788
